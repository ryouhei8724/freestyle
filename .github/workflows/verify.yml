name: Verify site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx wrangler deploy --config wrangler.static.jsonc --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
